<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise!</title>
    <style>
        body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #ffe4e1; font-family: 'Arial', sans-serif; overflow: hidden; }
        .container { text-align: center; background: white; padding: 40px; border-radius: 25px; width: 85%; box-shadow: 0 15px 30px rgba(0,0,0,0.1); position: relative; }
        h1 { color: #d63384; font-size: 1.8rem; margin-bottom: 30px; }
        .btn-wrapper { display: flex; justify-content: center; align-items: center; gap: 20px; min-height: 150px; }
        button { padding: 15px 30px; font-size: 1.1rem; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; touch-action: manipulation; }
        #yesBtn { background-color: #ff4d6d; color: white; position: relative; z-index: 1; }
        #noBtn { background-color: #6c757d; color: white; position: absolute; transition: 0.1s; z-index: 2; }
    </style>
</head>
<body>
    <div class="container" id="mainCard">
        <h1>Will you be my Valentine? ❤️</h1>
        <div class="btn-wrapper">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <script>
        function moveButton() {
            const btn = document.getElementById('noBtn');
            // Keeps the button within the visible screen area
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function celebrate() {
            document.getElementById('mainCard').innerHTML = `
                <h1 style="font-size: 2.5rem;">YAY! 🥰</h1>
                <p>I knew you'd click Yes eventually!</p>
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/KztT2c4u8mYYUiMKdJ/giphy.gif" style="width: 100%; border-radius: 15px;">
            `;
        }
    </script>
</body>
</html>
